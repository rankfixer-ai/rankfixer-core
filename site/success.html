<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Confirmed — Rankfixer</title>
<style>
  :root { --brand:#6C5CE7; --bg:#0D0D1A; --bg-card:#151528; --text:#F0F0F5; --text-muted:#8888A0; --border:#2A2A45; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; -webkit-font-smoothing:antialiased; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:3rem 2rem; max-width:480px; width:100%; text-align:center; }
  .check { width:64px; height:64px; border-radius:50%; background:rgba(108,92,231,.15); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 1.5rem; }
  h1 { font-size:1.6rem; font-weight:800; margin-bottom:.75rem; }
  p { color:var(--text-muted); line-height:1.6; margin-bottom:1.5rem; }
  a.btn { display:inline-block; background:var(--brand); color:#fff; padding:.8rem 1.6rem; border-radius:100px; text-decoration:none; font-weight:700; }
  .note { font-size:.85rem; color:var(--text-muted); margin-top:1.5rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Payment confirmed</h1>
    <p>Thanks — your RankFixer Full AI Visibility Report is on its way. We will email the report to the address you provided at checkout.</p>
    <a class="btn" href="/">Back to Rankfixer</a>
    <p class="note">Questions? Email <a href="mailto:acibronjan@gmail.com" style="color:var(--brand)">acibronjan@gmail.com</a></p>
  </div>
</body>
</html>
